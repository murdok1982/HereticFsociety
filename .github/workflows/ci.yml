name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, torch-free validation of the platform layer.
  platform:
    name: Platform (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install light profile
        run: |
          python -m pip install -U pip
          python -m pip install -r deployment/docker/requirements-platform.txt pytest ruff
          python -m pip install --no-deps -e .
      - name: CLI smoke
        run: |
          fsociety --version
          fsociety doctor --json > doctor.json || true
          python - <<'EOF'
          import json
          data = json.load(open("doctor.json"))
          assert data["checks"], "doctor produced no checks"
          EOF
      - name: Unit, API and security tests (no GPU/engine)
        run: python -m pytest -q -m "not gpu and not engine"
      - name: Engine-required tests must be reported as skipped
        run: python -m pytest -q -m "engine or gpu" || true

  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint toolchain and light runtime
        run: |
          python -m pip install -U pip
          python -m pip install ruff ty -r deployment/docker/requirements-platform.txt
      - name: Ruff format
        run: ruff format --check src tests
      - name: Ruff lint (import sorting included)
        run: ruff check --output-format=github --extend-select I src tests
      - name: Type check (platform)
        run: ty check src/fsociety --ignore import-not-found

  engine:
    name: Engine compatibility (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install engine + API
        run: uv sync --extra api --extra dev
      - name: Preserved Heretic CLI
        run: |
          uv run heretic --help
          uv run python -c "import heretic; print('heretic import ok')"
      # Engine type checking stays with the upstream pinned toolchain; a newer
      # ty release introduces rules that predate this tree. The platform layer
      # is type-checked in the quality job.
      - name: Upstream unit tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: Platform tests with engine installed
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run python -m pytest -q -m "not gpu"
      - name: Build wheel and sdist
        run: uv build
      - name: Verify package contents
        run: |
          uv run python - <<'EOF'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith("heretic/") for n in names), names
          assert any(n.startswith("fsociety/") for n in names), names
          print("wheel ok:", wheel)
          EOF

  # Model download + byte-identical export tests are expensive and network-heavy.
  # They run on master and on demand, not on every pull request.
  upstream-model-tests:
    name: Upstream model/export regression
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install
        run: uv sync --dev
      - name: Run upstream scripted tests
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run tests/run_tests.py 2>&1

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Container build (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: false
          tags: fsociety-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
